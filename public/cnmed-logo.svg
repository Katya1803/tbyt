<svg xmlns="http://www.w3.org/2000/svg" viewBox="250 380 640 470" width="640" height="470">
  <defs>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="270" y1="400" x2="870" y2="720">
      <stop offset="0" stop-color="#C99A2E"/>
      <stop offset="0.3" stop-color="#F2D777"/>
      <stop offset="0.5" stop-color="#D4A93C"/>
      <stop offset="0.75" stop-color="#F4DC7C"/>
      <stop offset="1" stop-color="#C9962B"/>
    </linearGradient>
    <!-- Cuts a thin gap in the N where the C's tail crosses it -->
    <mask id="gap">
      <rect x="250" y="380" width="640" height="470" fill="#fff"/>
      <line x1="560" y1="622" x2="645" y2="537" stroke="#000" stroke-width="86"/>
    </mask>
  </defs>

  <g fill="url(#gold)">
    <!-- N -->
    <g mask="url(#gap)">
      <rect x="597" y="400" width="70" height="322" rx="8"/>
      <rect x="796" y="400" width="69" height="322" rx="8"/>
      <polygon points="600,400 668,400 865,722 797,722"/>
    </g>

    <!-- C with tail flowing into the N -->
    <path d="M 534 478 A 131 131 0 1 0 527 655 L 645 537"
          fill="none" stroke="url(#gold)" stroke-width="62"/>

    <!-- Medical cross -->
    <rect x="378" y="554" width="105" height="22" rx="2"/>
    <rect x="420" y="513" width="22" height="104" rx="2"/>

    <!-- Wordmark -->
    <text x="625" y="812" text-anchor="middle"
          font-family="Montserrat, 'Segoe UI', Arial, sans-serif"
          font-size="68" letter-spacing="2">CNMED</text>
  </g>
</svg>
